<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stockroom Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working ledger. Slim header band, tab rail, one work surface per task. SKUs and quantities set in mono, like a packing slip. Stickers render as white physical labels in both themes. Charts use a validated categorical order, fixed per entity. */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --surface-2:#eaecea; --ink:#1c2220; --muted:#5b6561; --line:#d5d9d6;
  --accent:#1f5f8b; --accent-ink:#ffffff;
  --in:#2c7a4c; --in-bg:#e2f0e7; --out:#b0502a; --out-bg:#f7e6dd; --adj:#5f51a0; --adj-bg:#ebe8f6;
  --warn:#9a6400; --warn-bg:#faefd4; --bad:#b3261e; --bad-bg:#fbe2df;
  --sticker-bg:#ffffff; --sticker-ink:#111111; --sticker-rule:#b9b9b9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s-other:#b4b2a9; --s-free:#e1e3de;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131716; --surface:#1b201f; --surface-2:#242b29; --ink:#e6ebe9; --muted:#9aa6a1; --line:#333c39;
  --accent:#6aa9d6; --accent-ink:#0b1822;
  --in:#7cc89b; --in-bg:#1c3226; --out:#e69b75; --out-bg:#39251c; --adj:#b4a8e8; --adj-bg:#29243f;
  --warn:#e8b54a; --warn-bg:#382d13; --bad:#f08a82; --bad-bg:#3c1e1c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-other:#6b6a64; --s-free:#2c3230; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131716; --surface:#1b201f; --surface-2:#242b29; --ink:#e6ebe9; --muted:#9aa6a1; --line:#333c39;
  --accent:#6aa9d6; --accent-ink:#0b1822;
  --in:#7cc89b; --in-bg:#1c3226; --out:#e69b75; --out-bg:#39251c; --adj:#b4a8e8; --adj-bg:#29243f;
  --warn:#e8b54a; --warn-bg:#382d13; --bad:#f08a82; --bad-bg:#3c1e1c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s-other:#6b6a64; --s-free:#2c3230; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
header{background:var(--surface);border-bottom:1px solid var(--line);}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:14px 6px;}
h1{font:700 28px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance;}
.tag{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border:1px dashed var(--warn);color:var(--warn);border-radius:3px;margin-left:8px;vertical-align:4px;}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px;}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.field{display:grid;gap:4px;min-width:0;align-content:start;}
.field label{font-size:13px;color:var(--muted);font-weight:500;}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%;}
textarea{min-height:66px;resize:vertical;font-size:14px;line-height:1.4;}
textarea.csv{min-height:120px;font:12px/1.4 var(--mono);}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7;}
#staff{width:150px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.seg button{font:600 13px var(--body);border:0;background:transparent;color:var(--muted);padding:8px 11px;cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:thin;}
.tabs button{border:0;background:transparent;font:600 15px var(--body);color:var(--muted);padding:8px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;}
.tabs button:hover{color:var(--ink);background:var(--surface-2);}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.tabs .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:6px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font:500 11px/1.4 var(--mono);text-align:center;}
main .wrap{display:grid;gap:16px;padding-block:20px 28px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;}
.panel.review{border:2px solid var(--accent);}
h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 4px;}
h3{font:600 16px/1.3 var(--body);margin:18px 0 6px;}
.lede{color:var(--muted);margin:0 0 14px;max-width:70ch;}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;}
.kpi b{display:block;font:500 30px/1.1 var(--mono);font-variant-numeric:tabular-nums;}
.kpi b.txt{font:600 19px/1.25 var(--body);overflow-wrap:anywhere;}
.kpi span{color:var(--muted);font-size:13px;}
.kpi.attn b{color:var(--warn);}
.tablewrap{overflow-x:auto;margin-top:8px;}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
th{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:0;}
tr.sel td{background:var(--surface-2);}
.num{text-align:right;}
.mono{font-family:var(--mono);font-size:13.5px;}
.muted{color:var(--muted);}
.pill{display:inline-block;font:500 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:999px;white-space:nowrap;}
.pill.ok,.pill.IN{background:var(--in-bg);color:var(--in);}
.pill.low{background:var(--warn-bg);color:var(--warn);}
.pill.out{background:var(--bad-bg);color:var(--bad);}
.pill.OUT{background:var(--out-bg);color:var(--out);}
.pill.ADJ{background:var(--adj-bg);color:var(--adj);}
.pill.OPEN{background:var(--surface-2);color:var(--muted);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.scan{display:flex;gap:8px;}
.scan input{font-family:var(--mono);}
.btn{font:600 14px var(--body);border-radius:6px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);white-space:nowrap;}
.btn:hover{border-color:var(--muted);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface);}
.btn.small{padding:5px 9px;font-size:13px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.qty{width:84px;text-align:right;font-family:var(--mono);}
.lotin{width:120px;font-family:var(--mono);}
.err{color:var(--bad);font-size:13px;margin:6px 0 0;}
.check{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:14px;}
.check ul{margin:4px 0 0;padding-left:18px;}
.check .head{font-weight:600;}
.good{color:var(--in);font-weight:600;}
.bad{color:var(--bad);font-weight:600;}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
dl.sum{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0 0 6px;}
dl.sum dt{color:var(--muted);font-size:13px;}
dl.sum dd{margin:0;font-weight:500;min-width:0;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chips button{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.vpos{color:var(--in);font-weight:600;}
.vneg{color:var(--bad);font-weight:600;}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px;max-width:80ch;}
.banner{padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;margin:0 0 12px;}
.banner.drug{background:var(--bad-bg);color:var(--bad);}
.banner.claim{background:var(--warn-bg);color:var(--warn);}
.ws{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start;margin-top:12px;}
@media (max-width:780px){.ws{grid-template-columns:minmax(0,1fr);}}
.req ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:4px;font-size:14px;}
.req .count{font:500 13px var(--mono);}
.sticker{background:var(--sticker-bg);color:var(--sticker-ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:11px/1.35 var(--body);width:100%;max-width:400px;}
.sticker .nm{font:700 15px/1.15 var(--body);}
.sticker .nmfr{font:italic 500 13px/1.2 var(--body);margin-top:1px;}
.sticker .net{font:600 13px var(--body);margin-top:4px;}
.sticker .rule{border-top:1px solid var(--sticker-rule);margin:6px 0;}
.sticker b{font-weight:700;}
.sticker .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sticker .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px;}
.sticker .code{font:500 10px/1.3 var(--mono);text-align:right;}
.sticker .missing{color:#b3261e;font-style:italic;}
.sizecap{font:500 11px var(--mono);color:var(--muted);margin-top:6px;letter-spacing:.04em;}
/* charts */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media (max-width:820px){.charts{grid-template-columns:minmax(0,1fr);}}
.chart h3{margin:0 0 2px;}
.chart .csub{color:var(--muted);font-size:13px;margin:0 0 10px;}
.pie{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center;}
.pie svg{flex:none;max-width:100%;height:auto;}
.pie .c-total{font:500 26px var(--mono);fill:var(--ink);}
.pie .c-unit{font:500 12px var(--body);fill:var(--muted);}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px;flex:1 1 200px;min-width:0;font-size:14px;}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 3.4em;gap:8px;align-items:center;}
.legend .sw{width:12px;height:12px;border-radius:3px;}
.legend .lg{overflow-wrap:anywhere;}
.legend .v{font:500 13.5px var(--mono);text-align:right;}
.legend .p{font:400 12.5px var(--mono);color:var(--muted);text-align:right;}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;}
.blegend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 6px;}
.blegend span{display:inline-flex;align-items:center;gap:6px;}
.blegend i{display:inline-block;width:12px;height:12px;border-radius:3px;}
.axis{font:500 10.5px var(--mono);fill:var(--muted);}
.gridl{stroke:var(--line);stroke-width:1;}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px;}
.meter i{display:block;height:100%;border-radius:4px;}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font:500 13px/1.35 var(--body);padding:7px 10px;border-radius:6px;max-width:260px;}
[data-tip]{cursor:default;}
footer .wrap{display:grid;gap:10px;padding-block:0 32px;}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);z-index:20;}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bad);border-radius:8px;}
@media (max-width:520px){h1{font-size:24px;} .panel{padding:14px;} .sticker .two{grid-template-columns:1fr;}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>


<header>
  <div class="wrap top">
    <div>
      <h1>Stockroom Ledger<span class="tag" id="t-sample"></span></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="controls">
      <div class="field"><label for="staff" id="t-rec"></label><input id="staff" autocomplete="off"></div>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-zh" data-lang="zh">简体</button>
        <button type="button" id="lang-zht" data-lang="zht">繁體</button>
      </div>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>

<main><div class="wrap" id="view"></div></main>

<footer><div class="wrap">
  <p class="note" id="t-demo"></p>
  <div id="reset-area"></div>
</div></footer>

<datalist id="skulist"></datalist>
<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toast" role="status" hidden></div>

/* ---------- EAN-13 barcode ---------- */
const EAN_L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_R=EAN_L.map(s=>s.replace(/./g,c=>c==='0'?'1':'0'));
const EAN_G=EAN_R.map(s=>s.split('').reverse().join(''));
const PARITY=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanSvg(code){
  if(!/^\d{13}$/.test(code))return '';
  const d=code.split('').map(Number),par=PARITY[d[0]];
  let bits='101';for(let i=1;i<=6;i++)bits+=(par[i-1]==='L'?EAN_L:EAN_G)[d[i]];
  bits+='01010';for(let i=7;i<=12;i++)bits+=EAN_R[d[i]];bits+='101';
  const m=1.4,h=34,pad=9,w=bits.length*m+pad*2,guard=new Set([0,1,2,45,46,47,48,49,92,93,94]);
  let r='';for(let i=0;i<bits.length;i++)if(bits[i]==='1')r+=`<rect x="${(pad+i*m).toFixed(1)}" y="0" width="${m}" height="${guard.has(i)?h+5:h}"/>`;
  return `<svg viewBox="0 0 ${w} ${h+16}" width="${w}" height="${h+16}" role="img" aria-label="EAN ${code}"><g fill="#111">${r}</g><g fill="#111" font-family="IBM Plex Mono,monospace" font-size="9"><text x="1" y="${h+13}">${code[0]}</text><text x="${pad+3*m+21*m}" y="${h+13}" text-anchor="middle">${code.slice(1,7)}</text><text x="${pad+50*m+21*m}" y="${h+13}" text-anchor="middle">${code.slice(7)}</text></g></svg>`;
}

/* ---------- stock in / out validation ---------- */
function issues(k){
  const d=D[k],out=[],av=avail();
  if(!String(S.staff||'').trim())out.push(t('errNoStaff'));
  if(!d.partner)out.push(t(k==='receive'?'errPartnerIn':'errPartnerOut'));
  if(!d.ref.trim())out.push(t('errRef'));
  if(!d.lines.length){out.push(t('errNoLines'));return out;}
  if(k==='receive'){
    if(d.lines.some(l=>!isPosInt(l.qty)))out.push(t('errQty'));
  }else{
    if(d.lines.some(l=>!isPosInt(l.ordered)))out.push(t('errQty'));
    const short=d.lines.filter(l=>isPosInt(l.ordered)&&parseInt(l.ordered,10)>(av[l.sku]||0)).map(l=>l.sku);
    if(short.length)out.push(t('errAvail')+short.join(', '));
    const mis=d.lines.filter(l=>isPosInt(l.ordered)&&String(l.picked).trim()!==String(parseInt(l.ordered,10))).map(l=>l.sku);
    if(mis.length)out.push(t('errPick')+mis.join(', '));
  }
  return out;
}
function checkHtml(k){
  const iss=issues(k);
  if(!iss.length)return `<div class="check"><span class="good">✓ ${esc(t('ready'))}</span></div>`;
  return `<div class="check"><div class="head">${esc(t('checkHead'))}</div><ul>${iss.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
}
function updateCheck(k){
  const box=$(k+'-check');if(box)box.innerHTML=checkHtml(k);
  const b=document.querySelector(`[data-act="review"][data-k="${k}"]`);if(b)b.disabled=issues(k).length>0;
}
function shipStatus(l,av){
  if(!isPosInt(l.ordered))return `<span class="muted">—</span>`;
  const o=parseInt(l.ordered,10);
  if(o>av)return `<span class="bad">${esc(t('stShort'))}${o-av}</span>`;
  if(String(l.picked).trim()==='')return `<span class="muted">${esc(t('stPick'))}</span>`;
  if(String(l.picked).trim()!==String(o))return `<span class="bad">✕ ${esc(t('stMismatch'))}</span>`;
  return `<span class="good">✓ ${esc(t('stMatch'))}</span>`;
}

function arc(cx,cy,R,r,a0,a1){
  const p=(rad,a)=>`${(cx+rad*Math.cos(a)).toFixed(2)} ${(cy+rad*Math.sin(a)).toFixed(2)}`;
  const large=a1-a0>Math.PI?1:0;
  return `M${p(R,a0)} A${R} ${R} 0 ${large} 1 ${p(R,a1)} L${p(r,a1)} A${r} ${r} 0 ${large} 0 ${p(r,a0)} Z`;
}
function pieChart(title,rows){
  const live=rows.filter(r=>r.value>0),total=live.reduce((a,b)=>a+b.value,0);
  if(!total)return `<div class="empty">${esc(t('noData'))}</div>`;
  const cx=100,cy=100,R=92,r=56;let a0=-Math.PI/2,paths='';
  live.forEach(row=>{
    const frac=row.value/total,pct=Math.round(frac*1000)/10,tip=`${row.label}: ${row.value} ${t('casesUnit')} · ${pct}%`;
    if(frac>0.9999){const m=a0+Math.PI;paths+=`<path d="${arc(cx,cy,R,r,a0,m)}" fill="var(${row.color})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(tip)}"/><path d="${arc(cx,cy,R,r,m,a0+2*Math.PI)}" fill="var(${row.color})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(tip)}"/>`;}
    else{const a1=a0+frac*2*Math.PI;paths+=`<path d="${arc(cx,cy,R,r,a0,a1)}" fill="var(${row.color})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(tip)}"/>`;a0=a1;}
  });
  const label=`${title}: `+live.map(x=>`${x.label} ${x.value}`).join(', ');
  return `<div class="pie"><svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="${esc(label)}">${paths}
    <text x="100" y="99" text-anchor="middle" class="c-total">${total}</text><text x="100" y="118" text-anchor="middle" class="c-unit">${esc(t('casesUnit'))}</text></svg>
    <ul class="legend">${live.map(x=>`<li><span class="sw" style="background:var(${x.color})"></span><span class="lg">${esc(x.label)}</span><span class="v">${x.value}</span><span class="p">${Math.round(x.value/total*100)}%</span></li>`).join('')}</ul></div>`;
}
function sortRows(rows){const tail=rows.filter(r=>r.tail),head=rows.filter(r=>!r.tail).sort((a,b)=>b.value-a.value);return head.concat(tail);}
function periodStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()-(D.period-1)*DAY;}

function byCustomer(t0){
  const custs=S.partners.filter(p=>p.type==='customer'),sum={};let other=0;
  S.txns.filter(x=>x.type==='OUT'&&x.ts>=t0).forEach(x=>{const q=x.lines.reduce((a,l)=>a+l.qty,0);const i=custs.findIndex(c=>c.id===x.partner);if(i>=0&&i<SLOTS.length)sum[x.partner]=(sum[x.partner]||0)+q;else other+=q;});
  const rows=custs.slice(0,SLOTS.length).map((c,i)=>({label:c.name.replace(' (sample)',''),value:sum[c.id]||0,color:SLOTS[i]}));
  rows.push({label:t('other'),value:other,color:'--s-other',tail:true});
  return sortRows(rows);
}
function zoneUse(){
  const st=stock(),used={A:0,B:0,C:0};
  S.products.forEach(p=>{const z=(p.loc||'')[0];if(used[z]!==undefined)used[z]+=Math.max(0,st[p.sku]||0);});
  return used;
}
function capacityRows(){
  const used=zoneUse(),cap=S.zones,totalCap=Object.values(cap).reduce((a,b)=>a+b,0),totalUsed=Object.values(used).reduce((a,b)=>a+b,0);
  const rows=ZONES.map(([z,col])=>({label:t('zone_'+z),value:used[z],color:col}));
  rows.push({label:t('free'),value:Math.max(0,totalCap-totalUsed),color:'--s-free',tail:true});
  return rows;
}
function dailyBars(t0){
  const n=D.period,days=[];for(let i=0;i<n;i++)days.push({ts:t0+i*DAY,in:0,out:0});
  S.txns.forEach(x=>{if(x.ts<t0||(x.type!=='IN'&&x.type!=='OUT'))return;const i=Math.floor((x.ts-t0)/DAY);if(i<0||i>=n)return;const q=x.lines.reduce((a,l)=>a+l.qty,0);days[i][x.type==='IN'?'in':'out']+=q;});
  const mx=Math.max(1,...days.map(d=>Math.max(d.in,d.out)));
  const step=mx<=10?2:mx<=25?5:mx<=60?10:mx<=150?25:50,top=Math.ceil(mx/step)*step;
  const W=640,H=230,pl=34,pr=8,pt=10,pb=26,pw=W-pl-pr,ph=H-pt-pb,gw=pw/n,bw=Math.max(3,Math.min(14,gw*0.32));
  const y=v=>pt+ph-v/top*ph;let g='';
  for(let v=0;v<=top;v+=step)g+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="axis" x="${pl-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`;
  const every=n<=7?1:n<=14?2:5;let bars='';
  days.forEach((d,i)=>{
    const cx=pl+gw*i+gw/2,lbl=fmtDay(d.ts);
    [['in','--s1',cx-bw-1],['out','--s2',cx+1]].forEach(([k,col,x])=>{const v=d[k];if(!v)return;const h=Math.max(1.5,v/top*ph);
      bars+=`<rect x="${x.toFixed(1)}" y="${(pt+ph-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(${col})" data-tip="${esc(lbl+' · '+t(k==='in'?'legendIn':'legendOut')+': '+v+' '+t('casesUnit'))}"/>`;});
    if(i%every===0||i===n-1)bars+=`<text class="axis" x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(lbl)}</text>`;
  });
  return `<div class="blegend"><span><i style="background:var(--s1)"></i>${esc(t('legendIn'))}</span><span><i style="background:var(--s2)"></i>${esc(t('legendOut'))}</span></div>
  <div class="tablewrap" style="margin-top:0"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;display:block" role="img" aria-label="${esc(t('chDaily'))}">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ph}" y2="${pt+ph}" stroke="var(--muted)" stroke-width="1"/>${bars}</svg></div>`;
}

function jobStatus(j){
  const p=prod(j.sku);
  if(p&&p.flag==='drug')return `<span class="pill out">${esc(t('jb_hold'))}</span>`;
  return j.printed?`<span class="pill ADJ">${esc(t('jb_apply'))}</span>`:`<span class="pill low">${esc(t('jb_print'))}</span>`;
}
function scanResult(j){
  const p=prod(j.sku),sp=D.scanP.trim(),ss=D.scanS.trim().toUpperCase(),res=[];
  let okP=false,okS=false;
  if(sp){
    if(sp===p.ean){okP=true;res.push(`<li><span class="good">✓</span> ${esc(t('pOk'))}</li>`);}
    else{const o=S.products.find(x=>x.ean===sp);res.push(`<li><span class="bad">✕ ${esc(o?t('pWrong')+o.sku:t('pUnknown'))}</span></li>`);}
  }
  if(ss){
    if(ss===stickerCode(j)){okS=true;res.push(`<li><span class="good">✓</span> ${esc(t('sOk'))}</li>`);}
    else{const o=S.jobs.find(x=>stickerCode(x)===ss);res.push(`<li><span class="bad">✕ ${esc(o?t('sWrong')+o.sku+' / '+o.lot:t('sUnknown'))}</span></li>`);}
  }
  return {okP,okS,html:res.join('')};
}
function releaseIssues(j,sr){
  const p=prod(j.sku),out=[];
  if(!String(S.staff||'').trim())out.push(t('errNoStaff'));
  if(p.flag==='drug')out.push(t('needDrug'));
  if(reqChecks(p).some(c=>!c.ok))out.push(t('needData'));
  if(!j.printed)out.push(t('needPrint'));
  if(!sr.okP)out.push(t('needScanP'));
  if(!sr.okS)out.push(t('needScanS'));
  return out;
}

  const done=S.jobs.filter(j=>j.done).sort((a,b)=>b.doneTs-a.doneTs).slice(0,5);
  const job=S.jobs.find(j=>String(j.id)===String(D.job)&&!j.done);
  if(!D.lblSku)D.lblSku=job?job.sku:(open[0]?open[0].sku:S.products[0].sku);
  const p=prod(D.lblSku)||S.products[0];
  const lot=job&&job.sku===p.sku?job.lot:'SAMPLE';
  return `<section class="panel"><h2>${esc(t('queue'))}</h2><p class="lede">${esc(t('labelsLede'))}</p>
  ${open.length?`<div class="tablewrap"><table><thead><tr><th>${esc(t('time'))}</th><th>${esc(t('ref'))}</th><th>${esc(t('sku'))}</th><th>${esc(t('item'))}</th><th>${esc(t('lot'))}</th><th class="num">${esc(t('cases'))}</th><th class="num">${esc(t('toPrint'))}</th><th>${esc(t('status'))}</th><th></th></tr></thead><tbody>
  ${open.map(j=>`<tr class="${job&&job.id===j.id?'sel':''}"><td class="muted" style="white-space:nowrap">${esc(fmtTime(j.ts))}</td><td class="mono">${esc(j.ref)}</td><td class="mono">${esc(j.sku)}</td><td>${esc(pname(prod(j.sku)))}</td><td class="mono">${esc(j.lot)}</td><td class="num mono">${j.cases}</td><td class="num mono">${jobStickers(j)}</td><td>${jobStatus(j)}</td><td class="num"><button class="btn small" type="button" data-act="openJob" data-id="${j.id}">${esc(t('open'))}</button></td></tr>`).join('')}
  </tbody></table></div>`:`<p class="muted">${esc(t('queueEmpty'))}</p>`}
  ${done.length?`<h3>${esc(t('recent'))}</h3><div class="tablewrap"><table><thead><tr><th>${esc(t('time'))}</th><th>${esc(t('sku'))}</th><th>${esc(t('lot'))}</th><th class="num">${esc(t('cases'))}</th><th>${esc(t('by'))}</th></tr></thead><tbody>
  ${done.map(j=>`<tr><td class="muted" style="white-space:nowrap">${esc(fmtTime(j.doneTs))}</td><td class="mono">${esc(j.sku)}</td><td class="mono">${esc(j.lot)}</td><td class="num mono">${j.cases}</td><td>${esc(j.doneBy)}</td></tr>`).join('')}</tbody></table></div>`:''}
  </section>
  ${job?vRelease(job):''}
  <section class="panel"><h2>${esc(t('workspace'))}</h2>
  <div class="field" style="max-width:420px;margin-top:8px"><label for="lbl-sku">${esc(t('previewFor'))}</label><select id="lbl-sku">${S.products.map(x=>`<option value="${esc(x.sku)}" ${x.sku===p.sku?'selected':''}>${esc(x.sku)} · ${esc(pname(x))}</option>`).join('')}</select></div>
  <div class="ws"><div id="sticker-box">${stickerHtml(p,lot)}</div>
    <div><div id="flag-box">${flagBanner(p)}</div><div id="req-box">${reqHtml(p)}</div><p class="note" style="margin-top:14px">${esc(t('labelDisclaimer'))}</p></div></div>
  ${labelEditor(p)}
  </section>`;
}
function refreshLabelBits(){
  const p=prod(D.lblSku);if(!p)return;
  const job=S.jobs.find(j=>String(j.id)===String(D.job)&&!j.done);
  const lot=job&&job.sku===p.sku?job.lot:'SAMPLE';
  const sb=$('sticker-box');if(sb)sb.innerHTML=stickerHtml(p,lot);
  const rb=$('req-box');if(rb)rb.innerHTML=reqHtml(p);
  const rd=$('rel-dyn');if(rd&&job)rd.innerHTML=relDyn(job);
}

/* ---------- other views ---------- */
function vCount(){
  const st=stock(),c=D.count;
  return `<section class="panel"><h2>${esc(t('tab_count'))}</h2><p class="lede">${esc(t('countLede'))} ${esc(t('countHint'))}</p>
  <div class="tablewrap"><table><thead><tr><th>${esc(t('sku'))}</th><th>${esc(t('item'))}</th><th>${esc(t('loc'))}</th><th class="num">${esc(t('system'))}</th><th class="num">${esc(t('counted'))}</th><th class="num">${esc(t('variance'))}</th></tr></thead><tbody>
  ${S.products.map(p=>{const v=c.counts[p.sku]??'';return `<tr><td class="mono">${esc(p.sku)}</td><td>${esc(pname(p))}</td><td class="mono">${esc(p.loc)}</td><td class="num mono">${st[p.sku]}</td>
    <td class="num"><input class="qty" id="count-${esc(p.sku)}" inputmode="numeric" aria-label="${esc(t('counted'))} ${esc(p.sku)}" data-count="${esc(p.sku)}" value="${esc(v)}"></td>
    <td class="num mono" id="var-${esc(p.sku)}">${varHtml(p.sku,st)}</td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="field" style="margin-top:14px;max-width:520px"><label for="count-reason">${esc(t('reason'))}</label><input id="count-reason" value="${esc(c.reason)}" autocomplete="off"></div>
  ${c.err?`<p class="err">${esc(c.err)}</p>`:''}
  <div class="actions"><button class="btn primary" type="button" data-act="postCount">${esc(t('postAdj'))}</button></div></section>`;
}
function varHtml(sku,st){
  const v=D.count.counts[sku];
  if(v===undefined||String(v).trim()==='')return '<span class="muted">—</span>';
  if(!/^\d+$/.test(String(v).trim()))return '<span class="bad">?</span>';
  const diff=parseInt(v,10)-(st[sku]||0);
  if(diff===0)return '<span class="good">0</span>';
  return `<span class="${diff>0?'vpos':'vneg'}">${diff>0?'+':'−'}${Math.abs(diff)}</span>`;
}
function vCustomers(){
  const custs=S.partners.filter(p=>p.type==='customer');
  if(!D.cust&&custs.length)D.cust=custs[0].id;
  const c=custs.find(x=>x.id===D.cust);
  let detail='';
  if(c){
    const ships=S.txns.filter(x=>x.type==='OUT'&&x.partner===c.id).sort((a,b)=>b.ts-a.ts);
    const totals={};ships.forEach(x=>x.lines.forEach(l=>totals[l.sku]=(totals[l.sku]||0)+l.qty));
    detail=`<h3>${esc(c.name)}</h3>
    <dl class="sum"><dt>${esc(t('contact'))}</dt><dd>${esc(c.contact||'—')}</dd><dt>${esc(t('phone'))}</dt><dd class="mono">${esc(c.phone||'—')}</dd>
    <dt>${esc(t('orders'))}</dt><dd class="mono">${ships.length}</dd><dt>${esc(t('lastOrder'))}</dt><dd>${ships.length?esc(fmtTime(ships[0].ts)):'—'}</dd></dl>
    ${ships.length?`<h3>${esc(t('totals'))}</h3><div class="tablewrap"><table><thead><tr><th>${esc(t('sku'))}</th><th>${esc(t('item'))}</th><th class="num">${esc(t('cases'))}</th></tr></thead><tbody>
      ${Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([sku,q])=>`<tr><td class="mono">${esc(sku)}</td><td>${esc(pname(prod(sku)))}</td><td class="num mono">${q}</td></tr>`).join('')}</tbody></table></div>
      <h3>${esc(t('history'))}</h3><div class="tablewrap"><table><thead><tr><th>${esc(t('time'))}</th><th>${esc(t('ref'))}</th><th>${esc(t('items'))}</th><th>${esc(t('by'))}</th></tr></thead><tbody>
      ${ships.map(x=>`<tr><td class="muted">${esc(fmtTime(x.ts))}</td><td class="mono">${esc(x.ref)}</td><td class="mono">${esc(lineSummary(x))}</td><td>${esc(x.by)}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="muted">${esc(t('noOrders'))}</p>`}`;
  }
  return `<section class="panel"><h2>${esc(t('tab_customers'))}</h2><p class="lede">${esc(t('custLede'))}</p>
  <div class="chips">${custs.map(x=>`<button type="button" data-act="pickCust" data-id="${esc(x.id)}" aria-pressed="${x.id===D.cust}">${esc(x.name)}</button>`).join('')}</div>
  ${detail}</section>
  <section class="panel"><h2>${esc(t('addCustomer'))}</h2>
  <div class="grid2" style="margin-top:10px">
    <div class="field"><label for="nc-name">${esc(t('custName'))}</label><input id="nc-name" autocomplete="off"></div>
    <div class="field"><label for="nc-contact">${esc(t('contact'))}</label><input id="nc-contact" autocomplete="off"></div>
    <div class="field"><label for="nc-phone">${esc(t('phone'))}</label><input id="nc-phone" inputmode="tel" autocomplete="off"></div>
  </div>
  <p class="err" id="nc-err" hidden></p>
  <div class="actions"><button class="btn primary" type="button" data-act="saveCust">${esc(t('saveCust'))}</button></div></section>`;
}
function vLedger(){
  const types=['ALL','IN','OUT','ADJ','OPEN'];
  const rows=S.txns.filter(x=>D.ledgerType==='ALL'||x.type===D.ledgerType).sort((a,b)=>b.ts-a.ts);
  return `<section class="panel"><h2>${esc(t('tab_ledger'))}</h2><p class="lede">${esc(t('ledgerLede'))}</p>
  <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center">
    <div class="chips">${types.map(ty=>`<button type="button" data-act="ledgerType" data-ty="${ty}" aria-pressed="${D.ledgerType===ty}">${esc(ty==='ALL'?t('all'):t('T_'+ty))}</button>`).join('')}</div>
    <button class="btn" type="button" data-act="copyCsv">${esc(t('copyCsv'))}</button></div>
  ${D.csv?`<p class="muted" style="margin:12px 0 4px">${esc(t('copyFail'))}</p><textarea id="csv-out" class="csv" readonly aria-label="CSV">${esc(D.csv)}</textarea>`:''}
  <div class="tablewrap"><table><thead><tr><th>${esc(t('time'))}</th><th>${esc(t('type'))}</th><th>${esc(t('ref'))}</th><th>${esc(t('partner'))}</th><th>${esc(t('items'))}</th><th>${esc(t('by'))}</th></tr></thead><tbody>
  ${rows.length?rows.map(x=>`<tr><td class="muted" style="white-space:nowrap">${esc(fmtTime(x.ts))}</td><td><span class="pill ${x.type}">${esc(t('T_'+x.type))}</span></td><td class="mono">${esc(x.ref)}</td><td>${esc(partnerName(x.partner)||x.note||'—')}</td><td class="mono">${esc(lineSummary(x))}</td><td>${esc(x.by)}</td></tr>`).join(''):`<tr><td colspan="6" class="muted">${esc(t('none'))}</td></tr>`}
  </tbody></table></div></section>`;
}
function csvText(){
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=[['time','type','reference','customer_or_supplier','recorded_by','sku','item','qty_change_cases','note']];
  [...S.txns].sort((a,b)=>a.ts-b.ts).forEach(x=>x.lines.forEach(l=>{const p=prod(l.sku);rows.push([new Date(x.ts).toISOString(),x.type,x.ref,partnerName(x.partner),x.by,l.sku,p?p.name.en:'',(x.type==='OUT'?-1:1)*l.qty,x.note]);}));
  return rows.map(r=>r.map(q).join(',')).join('\n');
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=L==='zh'?'zh-Hans':(L==='zht'?'zh-Hant':'en');
  $('t-sample').textContent=t('sample');$('t-sub').textContent=t('sub');$('t-rec').textContent=t('rec');$('t-demo').textContent=t('demo');
  const staff=$('staff');if(document.activeElement!==staff)staff.value=S.staff||'';
  ['en','zh','zht'].forEach(k=>$('lang-'+k).setAttribute('aria-pressed',L===k));
  const openJobs=S.jobs.filter(j=>!j.done).length;
  $('tabs').innerHTML=TABS.map(k=>`<button type="button" role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}">${esc(t('tab_'+k))}${k==='labels'&&openJobs?`<span class="badge">${openJobs}</span>`:''}</button>`).join('');
  $('skulist').innerHTML=S.products.map(p=>`<option value="${esc(p.sku)}">${esc(pname(p))}</option>`).join('');
  const v={stock:vStock,reports:vReports,receive:()=>vEntry('receive'),labels:vLabels,ship:()=>vEntry('ship'),count:vCount,customers:vCustomers,ledger:vLedger}[tab];
  $('view').innerHTML=v();
  $('tip').hidden=true;
  $('reset-area').innerHTML=D.confirmReset
    ?`<div class="confirm"><span>${esc(t('resetQ'))}</span><button class="btn danger" type="button" data-act="resetYes">${esc(t('resetYes'))}</button><button class="btn" type="button" data-act="resetNo">${esc(t('cancel'))}</button></div>`
    :`<div><button class="btn small" type="button" data-act="reset">${esc(t('reset'))}</button></div>`;
}

function doScan(k){
  const inp=$('scan-'+k);if(!inp)return;
  const code=inp.value.trim().toUpperCase();if(!code)return;
  const p=prod(code),d=D[k];
  if(!p){d.err=t('errUnknownSku')+code;render();const n=$('scan-'+k);if(n){n.value=code;n.focus();n.select();}return;}
  d.err='';
  const ln=d.lines.find(l=>l.sku===p.sku);
  if(k==='receive'){if(ln)ln.qty=String((parseInt(ln.qty,10)||0)+1);else d.lines.push({sku:p.sku,qty:'1',lot:''});}
  else{if(ln)ln.ordered=String((parseInt(ln.ordered,10)||0)+1);else d.lines.push({sku:p.sku,ordered:'1',picked:''});}
  render();const n=$('scan-'+k);if(n)n.focus();
}
function post(k){
  if(issues(k).length){D[k].reviewing=false;render();return;}
  const d=D[k],ts=Date.now(),ref=d.ref.trim();
  S.txns.push({id:S.nextId++,ts,type:k==='receive'?'IN':'OUT',ref,partner:d.partner,by:String(S.staff).trim(),
    lines:d.lines.map(l=>({sku:l.sku,qty:parseInt(k==='receive'?l.qty:l.ordered,10)})),note:d.note.trim()});
  if(k==='receive'){
    d.lines.forEach((l,i)=>S.jobs.push({id:S.nextId++,sku:l.sku,lot:(l.lot||'').trim()||ref+'-'+(i+1),ref,cases:parseInt(l.qty,10),ts,printed:false,done:false,doneTs:null,doneBy:''}));
  }
  save();
  D[k]={partner:'',ref:'',lines:[],note:'',reviewing:false,err:''};
  toast(t(k==='receive'?'postedIn':'postedOut'));render();
}
function postCount(){
  const st=stock(),c=D.count,lines=[];
  for(const [sku,v] of Object.entries(c.counts)){
    if(String(v).trim()==='')continue;
    if(!/^\d+$/.test(String(v).trim())){c.err=t('errCount');render();return;}
    const diff=parseInt(v,10)-(st[sku]||0);if(diff!==0)lines.push({sku,qty:diff});
  }
  if(!String(S.staff||'').trim()){c.err=t('errNoStaff');render();return;}
  if(!lines.length){c.err='';toast(t('noVar'));render();return;}
  if(!c.reason.trim()){c.err=t('errReason');render();return;}
  const d=new Date();const ref='COUNT-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  S.txns.push({id:S.nextId++,ts:Date.now(),type:'ADJ',ref,partner:'',by:String(S.staff).trim(),lines,note:c.reason.trim()});
  save();D.count={counts:{},reason:'',err:''};
  toast(t('postedCount')+lines.map(l=>l.sku).join(', '));render();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-lang]');if(!el)return;
  if(el.dataset.lang){L=el.dataset.lang;try{localStorage.setItem(KEY+'-lang',L);}catch(err){}render();return;}
  const a=el.dataset.act,k=el.dataset.k;
  const job=S.jobs.find(j=>String(j.id)===String(D.job)&&!j.done);
  if(a==='tab'){tab=el.dataset.tab;try{history.replaceState(null,'','#'+tab);}catch(err){}render();window.scrollTo({top:0});}
  else if(a==='period'){D.period=+el.dataset.n;render();}
  else if(a==='scan')doScan(k);
  else if(a==='remove'){D[k].lines.splice(+el.dataset.i,1);render();}
  else if(a==='review'){if(!issues(k).length){D[k].reviewing=true;render();window.scrollTo({top:0});}}
  else if(a==='back'){D[k].reviewing=false;render();}
  else if(a==='post')post(k);
  else if(a==='postCount')postCount();
  else if(a==='openJob'){const j=S.jobs.find(x=>String(x.id)===el.dataset.id);if(j){D.job=j.id;D.lblSku=j.sku;D.scanP='';D.scanS='';render();const r=document.querySelector('.panel.review');if(r)r.scrollIntoView({block:'start'});}}
  else if(a==='closeJob'){D.job='';D.scanP='';D.scanS='';render();}
  else if(a==='markPrinted'&&job){job.printed=true;save();render();}
  else if(a==='fillScan'&&job){D.scanP=prod(job.sku).ean;D.scanS=stickerCode(job);render();}
  else if(a==='release'&&job){
    const sr=scanResult(job);if(releaseIssues(job,sr).length){render();return;}
    job.done=true;job.doneTs=Date.now();job.doneBy=String(S.staff).trim();save();
    D.job='';D.scanP='';D.scanS='';toast(t('released'));render();
  }
  else if(a==='pickCust'){D.cust=el.dataset.id;render();}
  else if(a==='saveCust'){
    const name=$('nc-name').value.trim(),errEl=$('nc-err');
    if(!name){errEl.textContent=t('errCustName');errEl.hidden=false;$('nc-name').focus();return;}
    const id='C'+(S.nextId++);
    S.partners.push({id,type:'customer',name,contact:$('nc-contact').value.trim(),phone:$('nc-phone').value.trim()});
    save();D.cust=id;toast(t('custSaved'));render();
  }
  else if(a==='ledgerType'){D.ledgerType=el.dataset.ty;render();}
  else if(a==='copyCsv'){
    const csv=csvText();
    const fail=()=>{D.csv=csv;render();const ta=$('csv-out');if(ta){ta.focus();ta.select();}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(csv).then(()=>{D.csv='';toast(t('copied'));render();}).catch(fail);}else fail();}catch(err){fail();}
  }
  else if(a==='reset'){D.confirmReset=true;render();}
  else if(a==='resetNo'){D.confirmReset=false;render();}
  else if(a==='resetYes'){S=seed();save();D=blankDrafts();toast(t('resetDone'));render();}
});
function onInput(e){
  const el=e.target;
  if(el.id==='staff'){S.staff=el.value;save();if(tab==='receive'||tab==='ship')updateCheck(tab);if(tab==='labels')refreshLabelBits();return;}
  if(el.id==='q'){D.q=el.value;$('stock-rows').innerHTML=stockRows();return;}
  if(el.id==='count-reason'){D.count.reason=el.value;return;}
  if(el.id==='lbl-sku'){D.lblSku=el.value;render();return;}
  if(el.id==='importer'){S.importer=el.value;save();refreshLabelBits();return;}
  if(el.id==='scan-p'||el.id==='scan-s'){if(el.id==='scan-p')D.scanP=el.value;else D.scanS=el.value;const job=S.jobs.find(j=>String(j.id)===String(D.job)&&!j.done);const rd=$('rel-dyn');if(rd&&job)rd.innerHTML=relDyn(job);return;}
  if(el.dataset.lbl){const p=prod(D.lblSku);if(!p)return;p.label[el.dataset.lbl]=el.value;save();refreshLabelBits();return;}
  if(el.dataset.bind){const [k,f]=el.dataset.bind.split('.');D[k][f]=el.value;updateCheck(k);return;}
  if(el.dataset.count){D.count.counts[el.dataset.count]=el.value;const c=$('var-'+el.dataset.count);if(c)c.innerHTML=varHtml(el.dataset.count,stock());return;}
  if(el.dataset.f){
    const k=el.dataset.k,i=+el.dataset.i,line=D[k].lines[i];if(!line)return;
    line[el.dataset.f]=el.value;
    if(k==='receive'){const oh=stock()[line.sku]||0;const c=$('receive-after-'+i);if(c)c.textContent=isPosInt(line.qty)?oh+parseInt(line.qty,10):'—';}
    else{const c=$('ship-st-'+i);if(c)c.innerHTML=shipStatus(line,avail()[line.sku]||0);}
    updateCheck(k);
  }
}
document.addEventListener('input',onInput);
document.addEventListener('change',e=>{if(e.target.tagName==='SELECT')onInput(e);});
document.addEventListener('keydown',e=>{
  const el=e.target;
  if(e.key==='Enter'&&el.dataset&&el.dataset.scan){e.preventDefault();doScan(el.dataset.scan);}
});
/* chart tooltip */
document.addEventListener('pointermove',e=>{
  const tip=$('tip'),el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){if(!tip.hidden)tip.hidden=true;return;}
  tip.textContent=el.getAttribute('data-tip');tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY+14;
  if(x+w>window.innerWidth-8)x=e.clientX-w-14;
  if(y+h>window.innerHeight-8)y=e.clientY-h-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
});
document.addEventListener('pointerleave',()=>{$('tip').hidden=true;});
render();
</script>
